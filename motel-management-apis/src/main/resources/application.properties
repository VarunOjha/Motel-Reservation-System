spring.application.name=motels
server.port=8085


# PostgreSQL config
# Use environment variables in production, hardcoded for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moteldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:moteluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:motelpass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optional init behavior
spring.datasource.initialization-mode=always
spring.sql.init.continue-on-error=false
