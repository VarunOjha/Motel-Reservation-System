<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555"/></marker>
    <style>
      .box{rx:6;ry:6;stroke-width:1.5}
      .lbl{text-anchor:middle;fill:#fff;font-weight:600}
      .sub{text-anchor:middle;fill:#fff;font-size:10;opacity:.85}
      .link{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:5,4}
    </style>
  </defs>

  <!-- Client -->
  <rect x="10" y="170" width="100" height="50" class="box" fill="#6b7280" stroke="#4b5563"/>
  <text x="60" y="192" class="lbl">Client</text>
  <text x="60" y="206" class="sub">HTTP</text>

  <!-- API Gateway -->
  <rect x="160" y="170" width="130" height="50" class="box" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="225" y="192" class="lbl">API Gateway</text>
  <text x="225" y="206" class="sub">Rust · Rate Limit</text>

  <!-- Motel Mgmt APIs -->
  <rect x="360" y="80" width="160" height="50" class="box" fill="#16a34a" stroke="#15803d"/>
  <text x="440" y="102" class="lbl">Motel Mgmt APIs</text>
  <text x="440" y="116" class="sub">Java · Spring Boot</text>

  <!-- Reservation APIs -->
  <rect x="360" y="260" width="160" height="50" class="box" fill="#16a34a" stroke="#15803d"/>
  <text x="440" y="282" class="lbl">Reservation APIs</text>
  <text x="440" y="296" class="sub">Go · Gin</text>

  <!-- PostgreSQL -->
  <rect x="590" y="80" width="120" height="50" class="box" fill="#9333ea" stroke="#7e22ce"/>
  <text x="650" y="102" class="lbl">PostgreSQL</text>
  <text x="650" y="116" class="sub">Motel Data</text>

  <!-- MongoDB -->
  <rect x="590" y="260" width="120" height="50" class="box" fill="#9333ea" stroke="#7e22ce"/>
  <text x="650" y="282" class="lbl">MongoDB</text>
  <text x="650" y="296" class="sub">Reservations</text>

  <!-- Scheduled Jobs -->
  <rect x="160" y="345" width="130" height="50" class="box" fill="#d97706" stroke="#b45309"/>
  <text x="225" y="367" class="lbl">Scheduled Jobs</text>
  <text x="225" y="381" class="sub">Python · CLI</text>

  <!-- Arrows -->
  <!-- Client → Gateway -->
  <line x1="110" y1="195" x2="158" y2="195" class="link"/>
  <!-- Gateway → Motel Mgmt -->
  <path d="M290,180 Q320,105 358,105" class="link"/>
  <!-- Gateway → Reservation -->
  <path d="M290,210 Q320,285 358,285" class="link"/>
  <!-- Motel Mgmt → Postgres -->
  <line x1="520" y1="105" x2="588" y2="105" class="link"/>
  <!-- Reservation → Mongo -->
  <line x1="520" y1="285" x2="588" y2="285" class="link"/>
  <!-- Jobs → Motel Mgmt -->
  <path d="M260,345 Q310,200 358,115" class="link dashed"/>
  <!-- Jobs → Reservation -->
  <path d="M280,370 Q320,330 358,290" class="link dashed"/>
</svg>
